name: Verify pricing and replay
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m unittest discover -s tests -v
      - run: cargo test --locked
        working-directory: prosperity_rust_backtester
        env:
          PYO3_PYTHON: python
      - run: python -m py_compile submissions/r4_final_v01_imc_upload.py
